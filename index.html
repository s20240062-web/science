<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>化学 一問一答</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#1d2a2e;--mute:#66767b;--line:#dedbd1;--acc:#0f766e;--on:#fff;--ok:#15803d;--okb:#e6f4ea;--ng:#b42318;--ngb:#fdeceb;--bl:#fff1bf;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181a;--card:#1b2427;--ink:#e8eeef;--mute:#92a4a9;--line:#2c383c;--acc:#2dd4bf;--on:#04201d;--ok:#4ade80;--okb:#14301f;--ng:#f87171;--ngb:#3a1b1b;--bl:#4a3d12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181a;--card:#1b2427;--ink:#e8eeef;--mute:#92a4a9;--line:#2c383c;--acc:#2dd4bf;--on:#04201d;--ok:#4ade80;--okb:#14301f;--ng:#f87171;--ngb:#3a1b1b;--bl:#4a3d12;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;touch-action:manipulation}
[hidden]{display:none!important}
main{max-width:640px;margin:0 auto;padding:20px 16px 24px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:16px;margin:20px 0 4px}
.sub{color:var(--mute);font-size:13px;margin:0 0 16px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 16px;min-height:46px}
button.p{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tg{display:flex;gap:8px;align-items:center;margin:0 0 12px;font-size:14px}
.tg input{width:20px;height:20px;accent-color:var(--acc)}
.unit{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0 0;cursor:pointer}
.unit input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.unit b{display:block;font-size:15px;line-height:1.4}
.unit small{color:var(--mute);font-size:12px}
.unit .n{margin-left:auto;color:var(--mute);font-size:13px;white-space:nowrap}
.bar{position:sticky;bottom:0;background:var(--bg);margin-top:12px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;border-top:1px solid var(--line)}
.bar div{flex:1;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
.chip{display:inline-block;font-size:12px;color:var(--acc);border:1px solid var(--line);border-radius:99px;padding:1px 10px;margin-bottom:10px}
.q{font-size:18px;line-height:1.9;margin:0}
.bk{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--acc);background:var(--bl);border-radius:4px;padding:0 6px;text-align:center}
.bk.ok{background:var(--okb);color:var(--ok);border-color:var(--ok);font-weight:700}
.bk.ng{background:var(--ngb);color:var(--ng);border-color:var(--ng);font-weight:700}
#ans{display:block;width:100%;font:inherit;font-size:16px;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0 12px;outline:none}
#ans:focus{border-color:var(--acc)}#ans[readonly]{opacity:.6}
.fb{border-radius:12px;padding:12px 14px;margin:0 0 12px}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.ng{background:var(--ngb);color:var(--ng)}
.fb p{margin:2px 0;color:var(--ink);font-size:15px}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.stat{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin:8px 0}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.g div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mute)}
.g b{display:block;font-size:26px;color:var(--ink)}
.kb{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:0 0 6px}
.kb button{padding:0;min-height:44px;font-size:18px;border-radius:10px;user-select:none;-webkit-user-select:none}
.hint{color:var(--mute);font-size:12px;margin:0 0 12px}
select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.dpo{display:flex;flex-direction:column;gap:10px;font-size:14px}.dpo .tg{margin:0}
body.dopa{background:#000;color:#fff}
body.dopa .card{color:var(--ink)}
body.dopa h1,body.dopa h2,body.dopa .stat,body.dopa .hint{color:#fff}
#hud{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#000d;color:#fff;border-radius:14px;padding:8px 14px;margin:10px 0 6px;font-weight:900;font-size:17px}
#sc{display:inline-block}#sc.b{animation:bp .3s}@keyframes bp{50%{transform:scale(1.6);color:#ffe600}}
#cb{color:#ffe600;text-shadow:0 0 10px #f80}
#bm{display:flex;align-items:center;gap:8px;margin:6px 0;color:#fff;font-weight:900}
#bmi{display:inline-block;font-size:26px}#bmw{flex:1;height:18px;background:#000a;border-radius:9px;overflow:hidden;border:2px solid #fff}
#bmf{display:block;height:100%;width:100%;background:#22c55e}#bmt{font-size:22px;min-width:1.4em;text-align:right;text-shadow:0 2px 3px #000}
#bm.dg #bmi{animation:wob .15s infinite}#bm.dg #bmf{animation:bl .25s infinite}
@keyframes wob{50%{transform:rotate(20deg) scale(1.4)}}@keyframes bl{50%{opacity:.3}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#fl{position:fixed;inset:0;pointer-events:none;z-index:49;opacity:0}#fl.go{animation:fl .45s}@keyframes fl{0%{opacity:.8}100%{opacity:0}}
#pops{position:fixed;inset:0;pointer-events:none;z-index:51;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pop{position:absolute;font-weight:900;white-space:nowrap;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 6px 0 #0008;animation:pp 1.15s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pp{0%{transform:scale(0) rotate(var(--r))}22%{transform:scale(1.35) rotate(var(--r))}65%{transform:scale(1) rotate(var(--r));opacity:1}100%{transform:scale(1.7) rotate(var(--r)) translateY(-50px);opacity:0}}
main.shk{animation:shk .55s}@keyframes shk{0%,100%{transform:none}8%{transform:translate(-30px,16px) rotate(-3deg) scale(1.03)}25%{transform:translate(26px,-20px) rotate(3deg)}42%{transform:translate(-22px,-12px) rotate(-2deg) scale(1.03)}60%{transform:translate(20px,16px) rotate(2deg)}80%{transform:translate(-10px,6px)}}
.dr{text-align:center;font-weight:700}.dr b{font-size:22px}.rk{font-size:96px;line-height:1.1;font-weight:900;color:#ffe600;-webkit-text-stroke:3px #000;paint-order:stroke fill}
body.play{position:fixed;left:0;right:0;top:var(--vt,0px);height:var(--vh,100dvh);overflow:hidden}
body.play main{height:100%;max-width:760px;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 16px max(10px,env(safe-area-inset-bottom))}
body.play #s2{flex:1;min-height:0;display:flex;flex-direction:column}
body.play #s2 .card{flex:1;min-height:110px;overflow:auto;margin:6px 0;display:flex;flex-direction:column}
body.play #s2 .card>:first-child{margin-top:auto}body.play #s2 .card>:last-child{margin-bottom:auto}
body.play .prog{margin-top:6px}body.play .stat{margin:4px 0}body.play #hud{margin:4px 0}body.play .kb button{min-height:40px}body.play .hint{margin:0 0 6px}body.play #ans{margin:2px 0 8px}body.play .fb{margin:0 0 8px}
main.zm{animation:zm .5s}@keyframes zm{40%{transform:scale(1.12)}}
main.sp{animation:sp .7s}@keyframes sp{to{transform:rotate(360deg)}}
main.hu{animation:hu .8s}@keyframes hu{to{filter:hue-rotate(360deg) saturate(3)}}
main.iv{animation:iv .4s}@keyframes iv{50%{filter:invert(1)}}
main.tl{animation:tl .6s}@keyframes tl{30%{transform:perspective(600px) rotateX(25deg)}60%{transform:perspective(600px) rotateY(-25deg)}}
.bn{position:fixed;left:-120%;top:38%;width:100%;white-space:nowrap;font:900 min(20vw,130px)/1 sans-serif;-webkit-text-stroke:4px #000;paint-order:stroke fill;z-index:52;pointer-events:none;animation:bn 1s linear forwards;transform:rotate(-8deg)}
@keyframes bn{to{left:120%}}
body.kbo .hint,body.kbo .stat,body.kbo .prog{display:none}
body.dopa #ans{border-color:#ffe600;box-shadow:0 0 14px #ffe600}
#ans.jt{animation:jt .15s}@keyframes jt{30%{transform:translateX(-8px) scale(1.02)}60%{transform:translateX(8px)}}
#ib{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:2px 0}.ac{font-size:22px}
.ibtn{min-height:34px;padding:2px 10px;font-size:13px;background:#000;color:#fff;border:2px solid}
.invr{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.it{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;flex:1;border:3px solid var(--c,var(--line));padding:8px;background:var(--card);color:var(--ink);text-align:center}
.it span{font-size:28px}.it small{color:var(--c)}.it em{font-size:11px;font-style:normal;color:var(--mute)}
.it.sel{outline:3px solid var(--acc);transform:scale(1.05)}.it.r2{box-shadow:0 0 12px var(--c)}
.it.r3{animation:gl .7s infinite alternate}@keyframes gl{to{box-shadow:0 0 28px 6px var(--c)}}
</style></head><body><main>

<section id="s1">
<h1>化学 一問一答</h1>
<p class="sub">答えをキーボードで入力。正解した問題は出ません。間違い・わからないは、あとでまた出ます。</p>
<label class="tg"><input type="checkbox" id="rnd" checked>最初の出題順をランダムにする</label>
<label class="tg" id="dpl" hidden><input type="checkbox" id="dp">🔥 ドパガキモード(爆音・爆発・時間制限)</label>
<div class="card dpo" id="dopt" hidden>
<p class="hint" style="margin:0">💣 爆弾問題がランダムで出現します(時間内に正解しないと大爆発)</p>
<label>🏁 ルール <select id="rl"><option value="ta">タイムアタック(全問正解までの速さ)</option><option value="sv">サバイバル(60秒・正解で+4秒・ミスで-5秒)</option></select></label>
<label class="tg"><input type="checkbox" id="snd" checked>効果音ON</label>
<div id="inv"></div><div class="row"><button id="dsc" disabled>選んだアイテムを捨てる</button></div>
</div>
<div class="row"><button id="all">全選択</button><button id="none">全解除</button></div>
<div id="list"></div>
<div class="bar"><div id="cnt"></div><button class="p" id="go">スタート</button></div>
</section>

<section id="s2" hidden>
<div class="row"><button id="back">← 範囲選択</button></div>
<div id="hud" hidden><span>🏆<span id="sc">0</span></span><span id="cb"></span><span id="tm"></span></div>
<div id="bm" hidden><span id="bmi">💣</span><span id="bmw"><i id="bmf"></i></span><b id="bmt"></b></div>
<div id="ib" hidden></div>
<div class="prog"><i id="pb"></i></div>
<div class="stat"><span id="st1"></span><span id="st2"></span></div>
<div class="card"><span class="chip" id="chip"></span><p class="q" id="qt"></p></div>
<div class="fb" id="fb" hidden></div>
<input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
<div class="kb" id="kb"></div>
<p class="hint">化学式用キー。H2O のように普通の数字で打っても正解になります。</p>
<div class="row" id="b1"><button class="p" id="ok" style="flex:1">答える</button><button id="dk">わからない</button></div>
<div class="row" id="b2" hidden><button class="p" id="nx" style="flex:1">次へ</button><button id="ov">正解にする</button></div>
</section>

<section id="s3" hidden>
<h1>おつかれさま!</h1>
<div id="rs"></div>
<div class="row" style="margin-top:16px"><button class="p" id="again" style="flex:1">同じ範囲でもう一度</button><button id="re">範囲を選び直す</button></div>
</section>
</main>

const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\u2010-\u2015\u2212]/g,'-').replace(/[\s^·・.*「」、。,]/g,'').replace(/[\u30A1-\u30F6]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
const ND=/[^\x00-\x7F]/;
function vars(a){
 const o=new Set(),add=x=>{x=norm(x);x&&o.add(x)};
 const segs=[a],m=a.match(/^(.*?(?:[^\x00-\x7F]|[)\]]))([A-Za-z\[][A-Za-z0-9\[\]()^+\-·・\/]*)$/);
 if(m&&ND.test(m[1]))segs.push(m[1],m[2]);
 for(const s of segs){
  const xs=[s],jp=/\(([^()]*[^\x00-\x7F][^()]*)\)/g,base=s.replace(jp,'');
  if(base!==s){xs.push(base);for(const t of s.matchAll(jp))xs.push(t[1])}
  for(const x of xs.slice())xs.push(x.replace(/\((?:I{1,3}|IV|V|VI{1,3})\)/g,''));
  xs.forEach(add);
 }
 if(/^\d+$/.test(a)){add(a+'族');add(a+'個')}
 return o;
}
function judge(q,input){
 if(!norm(input))return false;
 if(q.m){
  const exp=q.a.split(/[、,，]/).map(vars),got=input.split(/[、,，・\s]+/).map(norm).filter(Boolean),used=new Set();
  return got.length===exp.length&&got.every(g=>{const i=exp.findIndex((v,k)=>!used.has(k)&&v.has(g));if(i<0)return false;used.add(i);return true});
 }
 const ni=norm(input),af=norm((q.q.split('】')[1]||'')),vs=vars(q.a);
 (q.x||[]).forEach(e=>vars(e).forEach(v=>vs.add(v)));
 if(vs.has(ni))return true;
 for(const v of vs)if(ni.length>v.length&&ni.startsWith(v)&&af.startsWith(ni.slice(v.length)))return true;
 return false;
}
